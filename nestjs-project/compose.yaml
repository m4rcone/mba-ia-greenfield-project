services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Same image/codebase as the API, standalone Nest context (no HTTP port) consuming the
  # video-processing queue (TD-05). Env comes from the shared .env like nestjs-api.
  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Compile once, then exec node so SIGTERM reaches the app: npm reports it as exit 1 and
    # `nest start --watch` kills the child without running shutdown hooks. After code changes
    # run `docker compose restart video-worker` (or `npm run start:worker:dev` interactively).
    init: true
    # On a fresh clone `up -d` runs before `npm install` and `.env` may not exist yet, so the
    # first starts fail; restarting lets the worker come up on its own once both are in place.
    restart: unless-stopped
    command: ["sh", "-c", "node_modules/.bin/nest build --path tsconfig.worker.json && exec node dist-worker/worker/main"]
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Official minio/minio images are no longer published; pgsty/minio is a drop-in community fork.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=streamtube
      - MINIO_ROOT_PASSWORD=streamtube-secret
      # Backstop for abandoned multipart uploads; longer than the app reconciler threshold.
      - MINIO_API_STALE_UPLOADS_EXPIRY=48h
      # MinIO has no bucket-level CORS: it is configured globally on the server.
      - MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:3001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio:/policies:ro
    # `mc anonymous set download` also grants s3:ListBucket, which would let anyone list
    # every thumbnail key (and so every video UUID); the policy file allows GetObject only.
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 streamtube streamtube-secret &&
      mc mb --ignore-existing local/videos &&
      mc mb --ignore-existing local/thumbnails &&
      mc anonymous set none local/videos &&
      mc anonymous set-json /policies/thumbnails-anonymous-policy.json local/thumbnails
      "

volumes:
  redis-data:
  minio-data:


